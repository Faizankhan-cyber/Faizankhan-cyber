<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Faizan Khan | Learning Azure, Exploring Cloud Security</title>
  <desc id="desc">A personal cloud-security emblem showing an Azure-style cloud environment, segmented network zones, and an identity access checkpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091321"/>
      <stop offset="1" stop-color="#101F32"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55B8FF"/>
      <stop offset="1" stop-color="#2878D0"/>
    </linearGradient>
    <linearGradient id="secure" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45C6D8"/>
      <stop offset="1" stop-color="#76D6C5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <path d="M0 248H1200" stroke="#20344A" stroke-width="1"/>
  <path d="M58 65V235" stroke="url(#azure)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="91" y="112" fill="#F3F7FC" font-size="53" font-weight="650" letter-spacing="-1.8">Faizan Khan</text>
    <text x="94" y="155" fill="#B4C3D4" font-size="20" letter-spacing=".25">Learning Microsoft Azure</text>
    <circle cx="330" cy="148" r="2.5" fill="#55B8FF"/>
    <text x="348" y="155" fill="#B4C3D4" font-size="20" letter-spacing=".25">Exploring Cloud Security</text>
    <path d="M94 184H500" stroke="#2B4058" stroke-width="1"/>
    <text x="94" y="213" fill="#7F94AA" font-size="12" font-weight="600" letter-spacing="2.1">UNDERSTAND THE CLOUD. LEARN TO SECURE IT.</text>
  </g>

  <!-- Cloud environment and segmented security zones -->
  <g transform="translate(735 27)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 192H324C355 192 377 169 377 140C377 114 358 93 333 89C326 51 293 24 253 24C222 24 195 41 182 67C173 62 163 59 152 59C123 59 99 81 96 110C68 115 48 139 48 167C48 181 59 192 74 192Z"
          stroke="#526B84" stroke-width="1.7"/>
    <path d="M122 175H310C333 175 350 158 350 137C350 118 335 102 316 100" stroke="#2D4964" stroke-width="1.2" stroke-dasharray="3 7"/>

    <!-- Three private network segments -->
    <rect x="100" y="119" width="69" height="47" rx="7" stroke="#3D6385" stroke-width="1.3" fill="#10243A"/>
    <rect x="190" y="119" width="69" height="47" rx="7" stroke="#3D6385" stroke-width="1.3" fill="#10243A"/>
    <rect x="280" y="119" width="48" height="47" rx="7" stroke="#3D6385" stroke-width="1.3" fill="#10243A"/>
    <path d="M114 132H155M114 142H145M204 132H245M204 142H235M292 132H316M292 142H310" stroke="#54728F" stroke-width="1.4"/>
    <circle cx="121" cy="153" r="2.5" fill="#55B8FF" stroke="none"/>
    <circle cx="211" cy="153" r="2.5" fill="#55B8FF" stroke="none"/>
    <circle cx="299" cy="153" r="2.5" fill="#55B8FF" stroke="none"/>

    <!-- Identity checkpoint in front of the cloud network -->
    <path d="M169 94V108M169 108H190" stroke="url(#secure)" stroke-width="2"/>
    <circle cx="169" cy="85" r="18" fill="#102A3B" stroke="url(#secure)" stroke-width="1.8"/>
    <path d="M162 85V81C162 77 165 74 169 74C173 74 176 77 176 81V85" stroke="#B9F1E6" stroke-width="1.7"/>
    <rect x="158" y="84" width="22" height="17" rx="4" fill="#143B49" stroke="#79D8C7" stroke-width="1.5"/>
    <circle cx="169" cy="91" r="2" fill="#D9FFF5" stroke="none"/>
    <path d="M169 93V96" stroke="#D9FFF5" stroke-width="1.5"/>

    <!-- Controlled access path -->
    <path d="M169 103V111H134V119M169 111H224V119" stroke="#5DCDBB" stroke-width="1.6" stroke-dasharray="3 4"/>
    <path d="M169 111H304V119" stroke="#5DCDBB" stroke-width="1.6" stroke-dasharray="3 4"/>
    <circle cx="169" cy="111" r="3" fill="#8AE3D5" stroke="none"/>

    <!-- Subtle cloud resource links -->
    <path d="M134 166V181M224 166V181M304 166V181" stroke="#3D6385" stroke-width="1.2"/>
    <circle cx="134" cy="183" r="3" fill="#55B8FF" stroke="none"/>
    <circle cx="224" cy="183" r="3" fill="#55B8FF" stroke="none"/>
    <circle cx="304" cy="183" r="3" fill="#55B8FF" stroke="none"/>
  </g>

  <text x="1144" y="265" text-anchor="end" fill="#657D95" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2">FK  ·  BENGALURU, INDIA</text>
  <rect x=".5" y=".5" width="1199" height="299" rx="15.5" fill="none" stroke="#263B52"/>
</svg>