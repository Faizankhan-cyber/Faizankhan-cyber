<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Faizan Khan — Cloud Security</title>
  <desc id="desc">A minimal dark banner with a custom geometric identity and cloud network motif.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".45" fill="#FFFFFF" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#field)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grain)" opacity=".28"/>
  <path d="M0 0H1200V1H0Z" fill="#26364A"/>
  <path d="M54 54V246" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

