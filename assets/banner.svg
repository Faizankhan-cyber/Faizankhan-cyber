    <text x="90" y="153" fill="#A9B8CA" font-size="19" font-weight="450" letter-spacing=".35">Cloud Security  <tspan fill="#4B9BDB">/</tspan>  Identity  <tspan fill="#4B9BDB">/</tspan>  Microsoft Azure</text>
    <path d="M90 184H390" stroke="#34465D" stroke-width="1"/>
    <text x="90" y="213" fill="#71849B" font-size="12" font-weight="600" letter-spacing="2.2">BUILD WITH INTENT. SECURE BY DESIGN.</text>
  </g>

