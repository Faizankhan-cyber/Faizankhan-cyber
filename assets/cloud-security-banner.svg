<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Faizan Khan - Animated Azure Cloud Infrastructure and Security Banner</title>
  <desc id="bannerDesc">Animated cloud security blueprint for Faizan Khan featuring real-time telemetry flow across Identity, Network, Key Vault, and Policy-as-Code layers.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050912"/>
      <stop offset="50%" stop-color="#0A1426"/>
      <stop offset="100%" stop-color="#0E213B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1C32"/>
      <stop offset="100%" stop-color="#081120"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0E213B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E3A5F" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="390" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="390" rx="16" fill="url(#techGrid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="15" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Ambient Animated Background Nodes -->
  <g fill="#38BDF8">
    <circle cx="520" cy="85" r="2.5" opacity="0.2">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="548" cy="180" r="2" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.65;0.1" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="515" cy="295" r="2.5" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left Vertical Accent Rail + Animated Energy Pulse -->
  <rect x="44" y="42" width="5" height="306" rx="2.5" fill="#11243E"/>
  <rect x="44" y="42" width="5" height="95" rx="2.5" fill="url(#accentBar)">
    <animate attributeName="y" values="42;253;42" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- LEFT COLUMN: Identity, Positioning & Live Terminal -->
  <g font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
    <!-- Top Status Pill with Radar Pulse -->
    <rect x="70" y="42" width="404" height="28" rx="14" fill="#0B223B" stroke="#0284C7" stroke-width="1.2"/>
    <circle cx="89" cy="56" r="4" fill="#38BDF8"/>
    <circle cx="89" cy="56" r="4" fill="none" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="r" values="4;10" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="104" y="60" fill="#7DD3FC" font-size="11.5" font-weight="700" letter-spacing="1.4">AZURE INFRASTRUCTURE  &#183;  IAM  &#183;  CLOUD SECURITY</text>

    <!-- Main Name -->
    <text x="70" y="124" fill="#F8FAFC" font-size="55" font-weight="800" letter-spacing="-1">Faizan Khan</text>

    <!-- Role & Education -->
    <text x="70" y="158" fill="#38BDF8" font-size="18.5" font-weight="600">Cloud Infrastructure &#38; Cybersecurity Learner</text>
    <text x="70" y="185" fill="#94A3B8" font-size="14" font-weight="500">BCA (Cloud Architecture &#38; Cybersecurity) &#183; SSMRV College, Bengaluru</text>

    <!-- Live Terminal Command Box with Blinking Cursor -->
    <rect x="70" y="204" width="474" height="58" rx="8" fill="#07101E" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="86" y="226" fill="#64748B" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="11.5">faizan@azure-cloud:~$ <tspan fill="#38BDF8">./verify-security-posture.sh</tspan></text>
    <text x="86" y="247" fill="#34D399" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="11.5">[OK] VNet + NSG  [OK] Entra RBAC  [OK] Key Vault MI</text>
    <rect x="444" y="236" width="7" height="13" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom Credential & Focus Badges -->
    <g transform="translate(70, 280)">
      <rect x="0" y="0" width="154" height="30" rx="6" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#10B981"/>
      <circle cx="16" cy="15" r="4" fill="none" stroke="#34D399" stroke-width="1.2">
        <animate attributeName="r" values="4;9" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="19" fill="#A7F3D0" font-size="11.5" font-weight="700" letter-spacing="0.5">SC-900 CERTIFIED</text>

      <rect x="166" y="0" width="154" height="30" rx="6" fill="#172554" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="243" y="19" text-anchor="middle" fill="#BFDBFE" font-size="11.5" font-weight="700" letter-spacing="0.5">AZ-900 &#183; GH-900</text>

      <rect x="332" y="0" width="142" height="30" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
      <text x="403" y="19" text-anchor="middle" fill="#E0E7FF" font-size="11.5" font-weight="700" letter-spacing="0.5">TERRAFORM &#183; IaC</text>
    </g>

    <!-- Animated Bottom Telemetry Bar -->
    <rect x="70" y="332" width="474" height="2" fill="url(#bottomLine)"/>
    <circle cx="70" cy="333" r="3" fill="#38BDF8">
      <animate attributeName="cx" values="70;544;70" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RIGHT COLUMN: Animated Defense-in-Depth Architecture Blueprint Card -->
  <g transform="translate(576, 30)" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="584" height="330" rx="14" fill="url(#cardGrad)" stroke="#254670" stroke-width="1.5"/>

    <!-- Card Header Bar -->
    <rect x="1" y="1" width="582" height="40" rx="13" fill="#070F1D"/>
    <line x1="1" y1="41" x2="583" y2="41" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="22" cy="21" r="4.5" fill="#EF4444"/>
    <circle cx="38" cy="21" r="4.5" fill="#F59E0B"/>
    <circle cx="54" cy="21" r="4.5" fill="#10B981"/>
    <text x="76" y="25" fill="#7DD3FC" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.1">LIVE BLUEPRINT // AZURE DEFENSE-IN-DEPTH</text>

    <!-- Pulsing ZERO TRUST Pill -->
    <rect x="460" y="10" width="106" height="22" rx="11" fill="#062E26" stroke="#10B981" stroke-width="1"/>
    <circle cx="474" cy="21" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="518" y="25" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="10" font-weight="700">ZERO TRUST</text>

    <!-- Vertical Telemetry Bus Connecting L1 -> L2 -> L3 -> L4 -->
    <line x1="47" y1="84" x2="47" y2="282" stroke="#1E3A5F" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Flowing Data Packet 1 -->
    <circle cx="47" cy="84" r="4" fill="#38BDF8">
      <animate attributeName="cy" values="84;282" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.9;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Flowing Data Packet 2 (Staggered) -->
    <circle cx="47" cy="84" r="4" fill="#34D399">
      <animate attributeName="cy" values="84;282" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.9;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Layer 1: Identity & Access -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="544" height="54" rx="8" fill="#0D213A" stroke="#0284C7" stroke-width="1.3">
        <animate attributeName="stroke" values="#0284C7;#38BDF8;#0284C7" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="13" width="36" height="28" rx="6" fill="#082F49" stroke="#38BDF8" stroke-width="1"/>
      <text x="28" y="31" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="700">L1</text>
      <text x="60" y="23" fill="#F1F5F9" font-size="13.5" font-weight="700">Identity &#38; Access Perimeter</text>
      <text x="60" y="41" fill="#94A3B8" font-size="11.5">Microsoft Entra ID &#183; Security Groups &#183; Least-Privilege Azure RBAC</text>
      <rect x="440" y="16" width="90" height="22" rx="5" fill="#082F49" stroke="#0284C7" stroke-width="1">
        <animate attributeName="fill-opacity" values="1;0.55;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="485" y="31" text-anchor="middle" fill="#7DD3FC" font-family="Consolas, monospace" font-size="10" font-weight="700">IAM SCOPED</text>
    </g>

    <!-- Layer 2: Network & Compute -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="544" height="54" rx="8" fill="#0D213A" stroke="#2563EB" stroke-width="1.3">
        <animate attributeName="stroke" values="#2563EB;#60A5FA;#2563EB" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="13" width="36" height="28" rx="6" fill="#172554" stroke="#60A5FA" stroke-width="1"/>
      <text x="28" y="31" text-anchor="middle" fill="#60A5FA" font-family="Consolas, monospace" font-size="12" font-weight="700">L2</text>
      <text x="60" y="23" fill="#F1F5F9" font-size="13.5" font-weight="700">Segmented Network &#38; Linux Workloads</text>
      <text x="60" y="41" fill="#94A3B8" font-size="11.5">Azure VNet &#183; Subnet Isolation &#183; NSG Rules &#183; SSH Key Auth &#183; Ubuntu + Nginx</text>
      <rect x="440" y="16" width="90" height="22" rx="5" fill="#172554" stroke="#3B82F6" stroke-width="1">
        <animate attributeName="fill-opacity" values="1;0.55;1" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="485" y="31" text-anchor="middle" fill="#93C5FD" font-family="Consolas, monospace" font-size="10" font-weight="700">SEGMENTED</text>
    </g>

    <!-- Layer 3: Secrets & Workload Identity -->
    <g transform="translate(20, 188)">
      <rect x="0" y="0" width="544" height="54" rx="8" fill="#0D213A" stroke="#10B981" stroke-width="1.3">
        <animate attributeName="stroke" values="#10B981;#34D399;#10B981" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="13" width="36" height="28" rx="6" fill="#062E26" stroke="#34D399" stroke-width="1"/>
      <text x="28" y="31" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="12" font-weight="700">L3</text>
      <text x="60" y="23" fill="#F1F5F9" font-size="13.5" font-weight="700">Secret Management &#38; Passwordless Auth</text>
      <text x="60" y="41" fill="#94A3B8" font-size="11.5">Azure Key Vault &#183; System-Assigned Managed Identity &#183; Zero Hardcoded Secrets</text>
      <rect x="440" y="16" width="90" height="22" rx="5" fill="#062E26" stroke="#10B981" stroke-width="1">
        <animate attributeName="fill-opacity" values="1;0.55;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <text x="485" y="31" text-anchor="middle" fill="#6EE7B7" font-family="Consolas, monospace" font-size="10" font-weight="700">VAULTED</text>
    </g>

    <!-- Layer 4: Governance & IaC Security -->
    <g transform="translate(20, 254)">
      <rect x="0" y="0" width="544" height="54" rx="8" fill="#0D213A" stroke="#8B5CF6" stroke-width="1.3">
        <animate attributeName="stroke" values="#8B5CF6;#C4B5FD;#8B5CF6" dur="3.6s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="13" width="36" height="28" rx="6" fill="#2E1065" stroke="#A78BFA" stroke-width="1"/>
      <text x="28" y="31" text-anchor="middle" fill="#C4B5FD" font-family="Consolas, monospace" font-size="12" font-weight="700">L4</text>
      <text x="60" y="23" fill="#F1F5F9" font-size="13.5" font-weight="700">Governance &#38; Policy-as-Code</text>
      <text x="60" y="41" fill="#94A3B8" font-size="11.5">Azure Policy Guardrails &#183; Declarative Terraform &#183; Checkov Static Scans</text>
      <rect x="440" y="16" width="90" height="22" rx="5" fill="#2E1065" stroke="#8B5CF6" stroke-width="1">
        <animate attributeName="fill-opacity" values="1;0.55;1" dur="3.6s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
      <text x="485" y="31" text-anchor="middle" fill="#DDD6FE" font-family="Consolas, monospace" font-size="10" font-weight="700">AUDITED</text>
    </g>

    <!-- Animated Horizontal Security Scanner Sweep Across Blueprint -->
    <rect x="20" y="56" width="544" height="3" rx="1.5" fill="url(#scanBeam)">
      <animate attributeName="y" values="56;306;56" dur="5.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
